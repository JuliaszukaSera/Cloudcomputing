name: Build and deploy Python app to Azure Web App - flightmatch-rg

on:
  push:
    branches:
      - claude/bold-cray-C04qE
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'flightmatch-rg'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_59D5B6FF0A164DE78AA424B6E16A56FE }}
          package: .
